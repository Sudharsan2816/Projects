name: enterprise-rag

on:
  push:
    paths:
      - "enterprise-rag/**"
      - ".github/workflows/enterprise-rag.yml"
  pull_request:
    paths:
      - "enterprise-rag/**"
      - ".github/workflows/enterprise-rag.yml"

jobs:
  tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: enterprise-rag

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Run tests
        run: python -m pytest -q

      - name: Run RBAC evaluation
        run: python -m app.evaluation.rbac_eval --check
