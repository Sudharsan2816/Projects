name: market-research-copilot

on:
  push:
    paths:
      - "ai-market-research-copilot/**"
      - ".github/workflows/market-research-copilot.yml"
  pull_request:
    paths:
      - "ai-market-research-copilot/**"
      - ".github/workflows/market-research-copilot.yml"

jobs:
  tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-market-research-copilot

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic-settings loguru pytest

      - name: Run tests
        env:
          LLM_PROVIDER: ollama
          EMBEDDING_PROVIDER: local
        run: pytest -q
