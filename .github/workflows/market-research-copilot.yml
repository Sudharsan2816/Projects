name: market-research-copilot

on:
  push:
    paths:
      - "ai-market-research-copilot/**"
      - ".github/workflows/market-research-copilot.yml"
  pull_request:
    paths:
      - "ai-market-research-copilot/**"
      - ".github/workflows/market-research-copilot.yml"

jobs:
  tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-market-research-copilot

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r requirements-dev.txt

      - name: Run tests
        env:
          LLM_PROVIDER: ollama
          EMBEDDING_PROVIDER: local
        run: pytest -q

      - name: Lint
        run: ruff check backend tests scripts

      - name: Type check core evaluation and observability
        run: mypy backend/core/observability.py backend/evaluation scripts/run_rag_eval.py

      - name: Run deterministic RAG evaluation
        env:
          EMBEDDING_PROVIDER: local
        run: python -m scripts.run_rag_eval --check-thresholds
