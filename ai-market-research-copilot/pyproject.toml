[project]
name = "ai-market-research-copilot"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.139.2",
    "uvicorn[standard]==0.32.1",
    "python-multipart==0.0.32",
    "sqlalchemy==2.0.36",
    "pydantic-settings==2.6.1",
    "pymupdf==1.24.14",
    "pandas==2.2.3",
    "openpyxl==3.1.5",
    "faiss-cpu==1.9.0",
    "numpy==1.26.4",
    "google-genai>=1.0.0",
    "openai>=1.0.0",
    "httpx==0.28.1",
    "reportlab==4.2.5",
    "ddgs>=6.0.0",
    "python-dotenv==1.2.2",
]

[project.scripts]
app = "backend.main:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[tool.vercel]
entrypoint = "backend.main:app"
