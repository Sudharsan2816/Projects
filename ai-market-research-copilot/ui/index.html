<body data-theme="light">
  <div id="root"></div>

  <script>
    // API base: empty string when served from FastAPI (same origin).
    // Falls back to localhost:8000 when opened directly as file or via a dev server.
    window.API_BASE = (window.location.protocol === 'file:' ||
                       window.location.port === '5500' ||
                       window.location.port === '5501')
      ? 'http://localhost:8000'
      : '';
  </script>
